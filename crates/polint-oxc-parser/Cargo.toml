# oxc_parser 0.129.0 with a nesting limit, so a deeply nested file becomes a
# parse error rather than a stack overflow. See VENDOR.md.
[package]
name = "polint-oxc-parser"
version = "0.129.0-polint.1"
authors = ["Boshen <boshenc@gmail.com>", "Oxc contributors", "polint contributors"]
edition = "2024"
rust-version = "1.93.0"
description = "oxc_parser 0.129.0 with a nesting limit, as used by polint"
license = "MIT"
repository = "https://github.com/oaiz-io/polint"
homepage = "https://oxc.rs"
readme = "VENDOR.md"
include = [
    "/src",
    # Included by the crate documentation.
    "/examples/parser.rs",
    "/examples/parser_tsx.rs",
    "/LICENSE",
    "/VENDOR.md",
    "/UPSTREAM",
]
# The examples are documentation; their dependencies are not declared.
autoexamples = false
keywords = ["JavaScript", "TypeScript", "parser"]
categories = ["compilers", "development-tools"]

[lib]
name = "oxc_parser"
path = "src/lib.rs"

[dependencies]
oxc_allocator = "=0.129.0"
oxc_ast = "=0.129.0"
oxc_data_structures = { version = "=0.129.0", features = ["assert_unchecked", "fieldless_enum"] }
oxc_diagnostics = "=0.129.0"
oxc_ecmascript = "=0.129.0"
oxc_regular_expression = { version = "=0.129.0", optional = true }
oxc_span = "=0.129.0"
oxc_str = "=0.129.0"
oxc_syntax = "=0.129.0"

bitflags = "2.10.0"
cow-utils = "0.1.3"
memchr = "2.7.6"
num-bigint = "0.4.6"
num-traits = "0.2.19"
rustc-hash = "2"
seq-macro = "0.3.6"

[features]
default = ["regular_expression"]
regular_expression = ["dep:oxc_regular_expression"]
mutate_tokens = []
benchmarking = []
