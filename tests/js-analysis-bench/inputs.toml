# Inputs of the JS/TS analysis benchmark.
#
# Real packages are benchmark inputs only: each is pinned to one exact tarball
# by URL and two content hashes, fetched once by `bench.py fetch`, and read
# offline afterwards. `analysed` lists the files polint analyses and the
# recorder instruments, as globs relative to the package root; test and
# benchmark paths are left out of every package's set, so what is analysed is
# the package's shipped source (`bench.py`, `NOT_SHIPPED_RE`). `exports_skip`
# removes files whose module scope cannot load on its own.
# `compare_previous_set = true` also scores the package on its globs alone,
# apart from every other table, for one comparison with earlier reports.
schema_version = "polint-js-analysis-bench-inputs-1"

# Every package tree and construct case runs only inside this image, with no
# network, no credentials, a read-only root and all capabilities dropped.
[sandbox]
image = "node@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54"
node_version = "v24.22.3"

[[package]]
name = "axios"
version = "1.21.1"
format = "ESM source, Node and browser adapters"
licence = "MIT"
origin = "https://registry.npmjs.org/axios/-/axios-1.21.1.tgz"
integrity = "sha512-6eI5Q/Y4u/Um9dDlsRoq5pY2rxnUTv+L4PpLitnbk/i4jb3MxLZ5CsN5Ih3IysbeRYK4pR+P7qfMsOQl9fwwFQ=="
sha256 = "5659acb8c9414ad88aa539db8e529947c9bac8cdf55973e314a078fc0205751c"
analysed = ["lib/**/*.js"]
driver = "drivers/axios.mjs"
# Imported by the Node adapter at load time; the driver never sends a request,
# so placeholder modules stand in for them.
stubs = ["follow-redirects", "form-data", "https-proxy-agent", "proxy-from-env"]

[[package]]
name = "zod"
version = "4.6.7"
format = "TypeScript ESM source"
licence = "MIT"
origin = "https://registry.npmjs.org/zod/-/zod-4.6.7.tgz"
integrity = "sha512-g8W2D2kU6a8untc053fX1uVBKzM7yqAxW/3zwk83+6RyF2+SKOuV+c0wBDhUwzV1PaGapmZH+rmcUzPf+3CGwg=="
sha256 = "84efd155bed93270286e793fc951be270b536cbd5b0eeb111f0fa3967201d698"
analysed = ["src/**/*.ts"]
exports_skip = ["src/**/tests/**", "src/v3/benchmarks/**"]
compare_previous_set = true
driver = "drivers/zod.mjs"
# The largest package, with schema helpers that call themselves at several
# sites, so it is the scaling check of the refined layer: each of its fact
# dumps must finish in this many seconds, or `bench.py report` fails.
dump_budget_s = 180

