# The held-out set (research/package-graphs/HELD-OUT.md). No analysis change is
# tuned on these packages: their drivers come from each package's documentation,
# their recordings are committed apart from analysis code, and CI refuses a pull
# request that changes both. The report scores them in tables of their own.
#
# `tests_from` records a package through its own test suite: `paths` of the
# repository archive at `commit` (the release `tag`, checked against `sha256`)
# are placed in the package tree, and the modules the suite needs are installed
# from the committed `modules` manifest and its lockfile without install
# scripts, then mounted read-only.

