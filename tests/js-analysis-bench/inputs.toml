# Stitched trees. Each tree is analysed as one program and, apart, as one
# package graph per package, stitched; the report prints where the two differ.
# A tree is a benchmark package with the modules npm installs for it, each
# pinned like a package, at the path npm gives it (`npm install
# --package-lock-only --omit=dev`), or a fixture directory of this benchmark
# taken whole. A held-out package's tree is compared and never tuned on.
[[tree]]
name = "composition"
fixture = "composition"

[[tree]]
name = "composition-versions"
