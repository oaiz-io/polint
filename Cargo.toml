[workspace]
members = [
    "crates/polint",
    "crates/polint-bench",
    "crates/polint-eval",
    "crates/polint-macros",
    "examples/basic/.polint/rules",
    "examples/comment-ignores/.polint/rules",
    "examples/code-quality-metrics/.polint/rules",
    "examples/config-denied-literal/.polint/rules",
    "examples/custom-rule-go/.polint/rules",
    "examples/custom-rule-ts/.polint/rules",
    "examples/go-branch-obligations/.polint/rules",
    "examples/go-complexity/.polint/rules",
    "examples/go-import-boundaries/.polint/rules",
    "examples/go-sensitive-writes/.polint/rules",
    "examples/go-test-quality/.polint/rules",
    "examples/gorm-review-indexes/.polint/rules",
    "examples/multiple-rules/.polint/rules",
    "examples/review-rules/.polint/rules",
    "examples/ts-complexity/.polint/rules",
    "examples/ts-design-tokens/.polint/rules",
    "examples/ts-no-raw-api-calls/.polint/rules",
]
# The public-surface leak probe is compiled separately from the workspace.
# Keep the leak-gate probe OUT of normal workspace builds, lints, and tests; it
# is compiled in isolation only by crates/polint/tests/public_surface_leak.rs.
exclude = ["tests/fixtures/public-surface-leak-probe"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/oaiz-io/polint"
rust-version = "1.95"
version = "0.3.7"
description = "polint workspace crate: multi-language repo-local static analysis (Go and TypeScript/JavaScript today)"

[workspace.dependencies]
anyhow = "1.0.103"
assert_cmd = "2.2.1"
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4.18"
ignore = "0.4.25"
insta = "1.47.2"
json-strip-comments = "3.1.1"
libc = "0.2"
# These versions are part of persistent cache identities. Keep them exact so a
# downstream resolution cannot change analysis behavior without changing a key.
oxc_allocator = "=0.129.0"
oxc_ast = "=0.129.0"
oxc_parser = "=0.129.0"
oxc_resolver = "=11.19.1"
oxc_semantic = "=0.129.0"
oxc_span = "=0.129.0"
petgraph = "0.8.3"
predicates = "3.1.4"
proc-macro2 = "1.0.103"
proptest = "1.11.0"
quote = "1.0.42"
rayon = "1.12.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
serde_norway = "0.9.42"
sha2 = "0.10"
syn = { version = "2.0.111", features = ["full", "parsing", "printing"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tree-sitter = "=0.26.8"
tree-sitter-go = "=0.25.0"
windows-sys = "0.61.2"



# Rule packs and tooling depend on the unified `polint` crate (path + version for publish).
polint = { path = "crates/polint", version = "0.3.7" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
