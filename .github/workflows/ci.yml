name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  # ── Fast checks (<1 min each) ─────────────────────────────────────────────

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  supply-chain:
    name: cargo deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: ""
          command: check
          command-arguments: all

  # ── Compile checks (~1-3 min each) ────────────────────────────────────────

  msrv:
    name: MSRV (1.95) — cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace MSRV)
        run: cargo check --workspace --all-targets --all-features --locked

  language-features:
    name: "language features — ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no languages
            args: --no-default-features
          - name: Go only
            args: --no-default-features --features lang-go
          - name: TypeScript only
            args: --no-default-features --features lang-typescript
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check -p polint --all-targets ${{ matrix.args }} --locked
      - name: cargo clippy
        run: cargo clippy -p polint --all-targets ${{ matrix.args }} --locked -- -D warnings
      - name: cargo test (feature-aware library suite)
        run: cargo test -p polint --lib ${{ matrix.args }} --locked
      - name: cargo test (feature-specific CLI behavior)
        run: |
          cargo test -p polint --test cli ${{ matrix.args }} --locked disabled_
          cargo test -p polint --test cli ${{ matrix.args }} --locked new_rule_creates_skeleton
      - name: verify parser dependency isolation
        env:
          FEATURE_ARGS: ${{ matrix.args }}
          FEATURE_NAME: ${{ matrix.name }}
        run: |
          tree="$(cargo tree -p polint $FEATURE_ARGS --locked)"
          case "$FEATURE_NAME" in
            "no languages")
              ! grep -Eq '(^| )(oxc_|tree-sitter)' <<<"$tree"
              ;;
            "Go only")
              grep -q 'tree-sitter v' <<<"$tree"
              ! grep -Eq '(^| )oxc_' <<<"$tree"
              ;;
            "TypeScript only")
              grep -q 'oxc_parser v' <<<"$tree"
              ! grep -q 'tree-sitter v' <<<"$tree"
              ;;
          esac

  clippy:
    name: clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/src/go-sidecar/polint-go-frontend/go.sum
            crates/polint/src/go-sidecar/polint-go-symbols/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # ── Tests split for parallelism ───────────────────────────────────────────

  test-linux:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu — lib + example tests
            test-args: -p polint --lib --all-features --locked
          - name: ubuntu — integration tests
            test-args: -p polint --test '*' --all-features --locked

    steps:
      - uses: actions/checkout@v6

      - name: Free hosted runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost /opt/ghc
          df -h

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/src/go-sidecar/polint-go-frontend/go.sum
            crates/polint/src/go-sidecar/polint-go-symbols/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The TypeScript type sidecar runs the compiler the analyzed repository
      # provides. Installing one here is what makes its tests execute rather
      # than skip.
      - name: install TypeScript for the type sidecar
        run: npm install --no-save --no-audit --no-fund typescript@5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        env:
          POLINT_TS_TYPESCRIPT: ${{ github.workspace }}/node_modules/typescript
          POLINT_REQUIRE_TS_TYPESCRIPT: "1"
        run: cargo test ${{ matrix.test-args }}


  test-platform:
    name: "${{ matrix.os }} — lib tests"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/src/go-sidecar/polint-go-frontend/go.sum
            crates/polint/src/go-sidecar/polint-go-symbols/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The restored `target/` contains prebuilt build-script binaries. An
          # entry saved on a different runner architecture restores executables
          # this host cannot run — `rayon-core`'s build script failed with
          # "cannot execute binary file" on macos-latest. Scoping the key by
          # arch retires that entry and stops the mix recurring.
          key: ${{ runner.arch }}

      - name: cargo test (lib)
        run: cargo test -p polint --lib --all-features --locked


  # ── Quality gates consolidated ─────────────────────────────────────────────

  gates:
    name: "gates (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            crates/polint/src/go-sidecar/polint-go-frontend/go.sum
            crates/polint/src/go-sidecar/polint-go-symbols/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: polyglot Go+TS canary
        run: >-
          cargo test -p polint --lib --locked
          eval::go_rta::polyglot_go_ts_canary_resolves_go_edges_without_ts_interference
          -- --exact --test-threads=1 --nocapture

      - name: capability probe certification (L1-L3 gated, L4 reported)
        run: >-
          cargo test -p polint --lib --all-features --locked
          eval::capability_probes::capability_probe_certification_rollup
          -- --exact --test-threads=1 --nocapture

      - name: public-surface leak gate
        run: cargo test --package polint --test public_surface_leak --locked

      - name: determinism gate (N=10 seeded permutations)
        run: cargo test -p polint --lib eval::determinism_gate --locked

      - name: semantic-store regression gate (serialized)
        run: >-
          cargo test -p polint --lib --all-features --locked
          eval::bench::gate::tests::semantic_store_boundary::real_store_enabled_measurement_passes_locked_boundary
          -- --exact --ignored --test-threads=1 --nocapture

  # ── Artifact / smoke tests ─────────────────────────────────────────────────

  install-smoke:
    name: cargo install smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo install smoke (release install + --version)
        run: cargo test -p polint --test cargo_install_smoke --locked -- --ignored

  sarif:
    name: SARIF fixture + Code Scanning upload
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build polint (debug)
        run: cargo build -p polint --locked
      - name: Emit SARIF from example workspace
        run: |
          ../../target/debug/polint check --format sarif --fail-on none > polint-results.sarif
        working-directory: examples/ts-design-tokens
      - name: Validate SARIF shape
        run: |
          python3 - <<'PY'
          import json

          with open('examples/ts-design-tokens/polint-results.sarif') as f:
              sarif = json.load(f)
          assert sarif["version"] == "2.1.0"
          for rule in sarif["runs"][0]["tool"]["driver"].get("rules", []):
              assert "tags" not in rule
              assert "polint" in rule.get("properties", {}).get("tags", [])
          PY
      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: examples/ts-design-tokens/polint-results.sarif
